[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixaipy"
version = "0.1.0"
description = "Unofficial Python client, CLI and examples for the PixAI.art GraphQL/REST API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pixaipy contributors" }]
keywords = ["pixai", "pixai-art", "pixaipy", "api", "graphql", "client", "unofficial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pyflakes"]

[project.urls]
Homepage = "https://github.com/Riyoway/pixaipy"
Repository = "https://github.com/Riyoway/pixaipy"
Documentation = "https://github.com/Riyoway/pixaipy/blob/main/docs/API.md"

[project.scripts]
pixai = "pixaipy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
